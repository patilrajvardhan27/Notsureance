spring:
  application:
    name: notsureance-claims
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notsureance}
    username: ${DATABASE_USER:notsureance}
    password: ${DATABASE_PASSWORD:notsureance}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    out-of-order: true
    placeholders:
      demoEmailDomain: ${DEMO_EMAIL_DOMAIN:notsureance.dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  threads:
    virtual:
      enabled: true
  ai:
    model:
      chat: ${AGENT_MODEL:none}
      embedding: ${RAG_EMBEDDING_MODEL:none}
      image: none
      audio:
        transcription: none
    azure:
      openai:
        endpoint: ${AZURE_OPENAI_ENDPOINT:}
        api-key: ${AZURE_OPENAI_API_KEY:}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-4o}
        embedding:
          options:
            deployment-name: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-small}
            dimensions: 384
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

app:
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:10}
    entra:
      tenant-id: ${ENTRA_TENANT_ID:}
      audiences: ${ENTRA_API_AUDIENCES:}
      spa-client-id: ${ENTRA_SPA_CLIENT_ID:}
      api-scopes: ${ENTRA_API_SCOPES:}
  triage:
    fast-track-max-loss: 25000
    fast-track-max-fraud: 0.2
    investigation-min-fraud: 0.4
    anomaly-threshold: 2.5
  agent:
    max-tool-calls: 6
    timeout: 30s
    model-label: ${AGENT_MODEL:none}
    claude:
      model: ${CLAUDE_MODEL:claude-opus-5-5}
      max-tokens: 16000
      effort: ${CLAUDE_EFFORT:medium}
      refusal-fallback: ${CLAUDE_REFUSAL_FALLBACK:true}
  rag:
    embedder: ${RAG_EMBEDDER:hashing}
  graph:
    enabled: ${GRAPH_ENABLED:true}
    batch-size: 50
    max-attempts: 5
    sync-delay-ms: 5000
  ml:
    synthetic-samples: 3000
    retrain-cron: "0 0 3 * * *"
