spring:
  flyway:
    locations: classpath:db/migration,classpath:db/demo

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
