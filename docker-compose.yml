services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: notsureance
      POSTGRES_USER: notsureance
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notsureance -d notsureance"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  graph:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - graph-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    image: notsureance-claims:local
    depends_on:
      db:
        condition: service_healthy
      graph:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://graph:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://db:5432/notsureance
      DATABASE_USER: notsureance
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Run infra/entra/register-apps.sh and copy its output into .env}
      ENTRA_API_AUDIENCES: ${ENTRA_API_AUDIENCES:?Set ENTRA_API_AUDIENCES in .env}
      ENTRA_SPA_CLIENT_ID: ${ENTRA_SPA_CLIENT_ID:?Set ENTRA_SPA_CLIENT_ID in .env}
      ENTRA_API_SCOPES: ${ENTRA_API_SCOPES:?Set ENTRA_API_SCOPES in .env}
      DEMO_EMAIL_DOMAIN: ${DEMO_EMAIL_DOMAIN:-notsureance.dev}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db-data:
  graph-data:
